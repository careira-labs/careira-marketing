<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careira – Work that fits, found faster</title>
    <meta name="description" content="Launching soon – the AI talent-matching platform that understands people and jobs, and redefines how they connect." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #2b2f42;
        font-family: "Segoe UI", Arial, sans-serif;
        color: white;
      }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      flex: 1 1 auto;         /* grow to fill wrapper */
      padding: clamp(2rem, 6vw, 4rem) clamp(2rem, 8vw, 6rem);
      box-sizing: border-box;
    }

      .wrapper {
        display: flex;
        flex-direction: column;
        min-height: 100svh; /* better on mobile than 100vh */
      }

      .logo {
        height: 48px;
        width: auto;
        margin-bottom: 1.5rem;
      }

      h1 {
        font-size: 3.5rem;
        font-weight: 800;
        margin: 0;
        line-height: 1.2;
      }

      .subhead {
        font-size: 1.4rem;
        font-weight: 400;
        margin-top: 2rem;
        border-top: 3px solid #ff7a6f;
        padding-top: 1.2rem;
        max-width: 700px;
        line-height: 1.5;
      }

      .waitlist-form {
        display: flex;
        gap: 0.75rem;
        margin-top: 2rem;
        flex-wrap: wrap;
      }

      .waitlist-form input,
      .waitlist-form select {
        padding: 0.85rem 1.2rem;
        font-size: 1rem;
        border: none;
        border-radius: 999px;
        outline: none;
        background: white;
      }

      .waitlist-form input[type="text"] {
        min-width: 180px;
      }

      .waitlist-form input[type="email"] {
        min-width: 240px;
      }

      .waitlist-form select {
        min-width: 160px;
        cursor: pointer;
        color: #333;
      }

      .waitlist-form input:focus,
      .waitlist-form select:focus {
        box-shadow: 0 0 0 3px rgba(255, 122, 111, 0.4);
      }

      .waitlist-form button {
        padding: 0.85rem 1.8rem;
        font-size: 1rem;
        font-weight: 600;
        background: #ff7a6f;
        color: white;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .waitlist-form button:hover {
        background: #ff5c4d;
      }

      .waitlist-form button:disabled {
        background: #888;
        cursor: not-allowed;
      }

      .waitlist-message {
        margin-top: 1rem;
        font-size: 1rem;
      }

      .waitlist-message.success {
        color: #6ee7b7;
      }

      .waitlist-message.error {
        color: #fca5a5;
      }

    .footer {
      /* remove position/left/right/bottom */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 6rem;
      flex-wrap: wrap;
      gap: 0.5rem;
      box-sizing: border-box;
    }

      .footer-item {
        color: #ff7a6f;
        font-weight: 500;
      }

      .footer-item.email {
        text-decoration: none;
      }

      @media (max-width: 768px) {
        .container {
          padding: 2rem;
        }

        h1 {
          font-size: 2.2rem;
        }

        .subhead {
          font-size: 1.1rem;
        }

        .footer {
        padding: 1rem 2rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
        }

        .footer-item {
          font-size: 0.9rem;
        }

        .waitlist-form {
          flex-direction: column;
        }

        .waitlist-form input,
        .waitlist-form select {
          min-width: auto;
          width: 100%;
        }

        .waitlist-form button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
  <div class="wrapper">
    <div class="container">
      <img src="/assets/LOGO-Careira-bitone-white.png" alt="Careira" class="logo" />
      <h1>Work that fits,<br />found faster</h1>
      <div class="subhead">
        Launching soon – the AI talent-matching platform that understands people and jobs – and
        redefines how they connect.
      </div>
      <form class="waitlist-form" id="waitlist-form">
        <input type="text" name="name" placeholder="Your name" required />
        <input type="email" name="email" placeholder="Email address" required />
        <select name="user_type" id="user-type" required>
          <option value="" disabled selected>I am a...</option>
          <option value="candidate">Candidate</option>
          <option value="recruiter">Recruiter</option>
          <option value="employer">Employer</option>
        </select>
        <input type="text" name="company" id="company-field" placeholder="Company name (optional)" style="display:none;" />
        <button type="submit">Join the waitlist</button>
      </form>
      <div class="waitlist-message" id="waitlist-message"></div>
    </div>
    <div class="footer">
      <span class="footer-item">&copy; 2026 Careira Ltd. Registered in England and Wales with company number 16937993.</span>
      <a href="mailto:info@careira.com" class="footer-item email">info@careira.com</a>
    </div>
    </div>
    <script>
      const API_URL = 'https://api.careira.com';
      const form = document.getElementById('waitlist-form');
      const message = document.getElementById('waitlist-message');
      const params = new URLSearchParams(window.location.search);

      // ?reset clears localStorage and shows form (for testing/admin)
      if (params.has('reset')) {
        localStorage.removeItem('careira_waitlist');
        // Clean URL without reload
        window.history.replaceState({}, '', window.location.pathname);
      }

      // Check if already signed up (skip if reset was just used)
      if (localStorage.getItem('careira_waitlist') && !params.has('reset')) {
        form.style.display = 'none';
        message.textContent = "You're on the waitlist. Thank you for your interest.";
        message.classList.add('success');
      }

      // Show company field for recruiters/employers only
      const userTypeSelect = document.getElementById('user-type');
      const companyField = document.getElementById('company-field');
      userTypeSelect.addEventListener('change', () => {
        const showCompany = ['recruiter', 'employer'].includes(userTypeSelect.value);
        companyField.style.display = showCompany ? 'block' : 'none';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = form.name.value.trim();
        const email = form.email.value.trim();
        const userType = form.user_type.value;
        const company = form.company.value.trim() || null;
        const button = form.querySelector('button');

        button.disabled = true;
        button.textContent = 'Joining...';
        message.textContent = '';
        message.className = 'waitlist-message';

        try {
          const payload = { email, first_name: name, user_type: userType };
          if (company) payload.company = company;

          const res = await fetch(`${API_URL}/waitlist/join`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();

          if (res.ok && data.success) {
            localStorage.setItem('careira_waitlist', email);
            message.textContent = "You're on the waitlist. Thank you for your interest.";
            message.classList.add('success');
            form.style.display = 'none';
          } else {
            throw new Error(data.detail || 'Something went wrong');
          }
        } catch (err) {
          message.textContent = err.message || 'Failed to join. Please try again.';
          message.classList.add('error');
        } finally {
          button.disabled = false;
          button.textContent = 'Join the waitlist';
        }
      });
    </script>
  </body>
</html>
